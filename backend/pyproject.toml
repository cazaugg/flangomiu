[project]
name = "flangomiu-backend"
version = "0.1.0"
description = "Flask API for the Flangomiu family diary and planning app"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-sqlalchemy>=3.1",
    "gunicorn>=26.2.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
